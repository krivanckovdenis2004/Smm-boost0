<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Новый пароль — SMM-Boost</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { min-height: 100dvh; margin:0; display:grid; place-items:center; font-family: system-ui, -apple-system, sans-serif; background:#f8fafc; padding:16px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:24px; max-width: 420px; width:100%; box-shadow: 0 10px 30px rgba(15,23,42,.06); }
    h1 { margin:0 0 4px; font-size:20px; color:#0f172a; }
    p { color:#475569; font-size:14px; margin: 4px 0 16px; }
    label { display:block; font-size:12px; color:#475569; margin-bottom:6px; }
    input { width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #e2e8f0; border-radius:10px; font-size:15px; margin-bottom:12px; }
    button { width:100%; padding:12px; border-radius:10px; border:0; background:#4f46e5; color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .err { color:#b91c1c; background:#fef2f2; border:1px solid #fecaca; padding:10px; border-radius:10px; font-size:13px; margin-bottom:12px; }
    .ok { color:#065f46; background:#ecfdf5; border:1px solid #a7f3d0; padding:10px; border-radius:10px; font-size:13px; margin-bottom:12px; }
    a { color:#4f46e5; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>Новый пароль</h1>
    <p id="hint">Задайте новый пароль для вашего аккаунта.</p>
    <div id="err" class="err" hidden></div>
    <div id="ok" class="ok" hidden></div>
    <div id="fields">
      <label>Новый пароль</label>
      <input type="password" id="pwd" minlength="6" required autocomplete="new-password" />
      <button type="submit" id="submit">Сохранить</button>
    </div>
    <p style="text-align:center; margin-top:16px;"><a href="/auth.html">Ко входу</a></p>
  </form>

  <script type="module">
    import { auth } from "/firebase.js";
    import {
      verifyPasswordResetCode,
      confirmPasswordReset,
      applyActionCode,
      checkActionCode,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const params = new URLSearchParams(location.search);
    const mode = params.get("mode");
    const oobCode = params.get("oobCode");
    const errEl = document.getElementById("err");
    const okEl = document.getElementById("ok");
    const fields = document.getElementById("fields");
    const hint = document.getElementById("hint");
    const form = document.getElementById("form");

    function fail(msg) { errEl.textContent = msg; errEl.hidden = false; }
    function done(msg) { okEl.textContent = msg; okEl.hidden = false; fields.hidden = true; }

    async function init() {
      if (!oobCode) {
        fail("Ссылка недействительна или устарела. Запросите новое письмо.");
        fields.hidden = true;
        return;
      }
      try {
        if (mode === "verifyEmail") {
          await applyActionCode(auth, oobCode);
          hint.textContent = "";
          done("Email подтверждён. Теперь вы можете войти.");
          setTimeout(() => location.replace("/auth.html?verified=1"), 1500);
          return;
        }
        if (mode === "resetPassword" || !mode) {
          const email = await verifyPasswordResetCode(auth, oobCode);
          hint.textContent = `Задайте новый пароль для ${email}.`;
        } else {
          // recoverEmail и др. — просто применяем код.
          await checkActionCode(auth, oobCode);
          await applyActionCode(auth, oobCode);
          done("Действие выполнено.");
        }
      } catch (err) {
        fail("Ссылка недействительна или срок её действия истёк.");
        fields.hidden = true;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.hidden = true;
      const pwd = document.getElementById("pwd").value;
      const btn = document.getElementById("submit");
      btn.disabled = true; btn.textContent = "Сохраняем...";
      try {
        await confirmPasswordReset(auth, oobCode, pwd);
        done("Пароль обновлён. Перенаправляем ко входу...");
        setTimeout(() => location.replace("/auth.html"), 1500);
      } catch (err) {
        fail(err?.message || "Не удалось сохранить пароль.");
        btn.disabled = false; btn.textContent = "Сохранить";
      }
    });

    // Жёсткий таймаут: если что-то зависло — покажем ошибку.
    setTimeout(() => {
      if (!okEl.hidden || !errEl.hidden) return;
      if (fields.hidden === false && !document.getElementById("pwd").value) return;
    }, 8000);

    init();
  </script>
</body>
</html>
