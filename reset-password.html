<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#0b0f1a" />
<meta name="robots" content="noindex, nofollow" />
<title>Смена пароля · SMM-Boost</title>
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--bg-1:#0b0f1a;--bg-2:#111a2e;--accent:#7c5cff;--accent-2:#22d3ee;--danger:#ff5d73;
    --card:rgba(255,255,255,.06);--card-br:rgba(255,255,255,.12);--text:#eef2ff;--muted:#9aa3b2;
    --input:rgba(255,255,255,.05);--input-br:rgba(255,255,255,.14);--r-lg:20px;--r-md:12px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden;margin:0}
  body{min-height:100dvh;color:var(--text);font-family:'Inter',-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 10% -10%,rgba(124,92,255,.35),transparent 60%),
      radial-gradient(900px 500px at 110% 10%,rgba(34,211,238,.25),transparent 60%),
      linear-gradient(180deg,var(--bg-1),var(--bg-2));
    display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--card-br);
    backdrop-filter:blur(24px) saturate(140%);border-radius:var(--r-lg);padding:24px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
  h1{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
  p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5}
  .field{margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .iw{display:flex;align-items:center;background:var(--input);border:1px solid var(--input-br);border-radius:var(--r-md);transition:.2s}
  .iw:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,92,255,.18)}
  .iw.error{border-color:var(--danger)}
  input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:14px;font:500 15px/1.2 'Inter',sans-serif;min-width:0}
  .toggle{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:0 12px;font-size:13px;font-weight:600}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;
    border:0;border-radius:var(--r-md);padding:14px 16px;font:700 15px/1 'Inter',sans-serif;cursor:pointer;min-height:50px;transition:.2s}
  .btn-primary{color:#fff;background:linear-gradient(135deg,var(--accent),#5b3fe0);box-shadow:0 10px 30px -10px rgba(124,92,255,.7)}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed}
  .btn-ghost{background:rgba(255,255,255,.05);color:#fff;border:1px solid var(--card-br);margin-top:8px}
  .hint{font-size:12px;color:var(--danger);min-height:1em;margin-top:6px}
  .state{text-align:center}
  .ico{width:64px;height:64px;margin:8px auto 14px;border-radius:50%;display:grid;place-items:center;font-size:28px;
    background:radial-gradient(circle,rgba(34,197,94,.35),rgba(34,197,94,.05) 70%);border:1px solid var(--card-br)}
  .hidden{display:none !important}
  .spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <section class="card" id="card">
    <!-- reset password mode -->
    <div id="resetForm" class="hidden">
      <h1>Новый пароль</h1>
      <p>Придумайте надёжный пароль от 8 символов.</p>
      <form id="form" novalidate>
        <div class="field">
          <label for="p1">Новый пароль</label>
          <div class="iw"><input id="p1" type="password" autocomplete="new-password" placeholder="Минимум 8 символов" required>
            <button type="button" class="toggle" data-t="p1">Показать</button></div>
          <div class="hint" id="h1"></div>
        </div>
        <div class="field">
          <label for="p2">Повторите пароль</label>
          <div class="iw"><input id="p2" type="password" autocomplete="new-password" placeholder="Повторите пароль" required>
            <button type="button" class="toggle" data-t="p2">Показать</button></div>
          <div class="hint" id="h2"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="save">Сохранить пароль</button>
        <a href="/auth.html" class="btn btn-ghost">Вернуться ко входу</a>
      </form>
    </div>

    <!-- verify email mode -->
    <div id="verifying" class="state">
      <div class="ico">⏳</div>
      <h1>Проверяем ссылку…</h1>
      <p>Пожалуйста, подождите.</p>
    </div>

    <div id="verifyOk" class="state hidden">
      <div class="ico">✓</div>
      <h1>Email успешно подтверждён</h1>
      <p>Перенаправляем вас в личный кабинет…</p>
      <a href="/dashboard.html" class="btn btn-primary">Перейти в кабинет</a>
    </div>

    <div id="errorBox" class="state hidden">
      <div class="ico" style="background:radial-gradient(circle,rgba(255,93,115,.35),rgba(255,93,115,.05) 70%)">✕</div>
      <h1>Ссылка недействительна</h1>
      <p id="errorMsg">Ссылка устарела или уже была использована.</p>
      <a href="/auth.html" class="btn btn-primary">Вернуться ко входу</a>
    </div>
  </section>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, verifyPasswordResetCode, confirmPasswordReset, applyActionCode }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { firebaseConfig } from '/firebase-auth.js';

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);

const qs = new URLSearchParams(location.search);
const mode = qs.get('mode');
const code = qs.get('oobCode');

const $ = s => document.querySelector(s);
const show = id => {
  ['resetForm','verifying','verifyOk','errorBox'].forEach(i=>document.getElementById(i).classList.toggle('hidden', i!==id));
};

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-t]'); if(!b) return;
  const inp = document.getElementById(b.dataset.t);
  const s = inp.type==='password'; inp.type = s?'text':'password'; b.textContent = s?'Скрыть':'Показать';
});

async function run(){
  if(!code){ $('#errorMsg').textContent='Ссылка недействительна.'; show('errorBox'); return; }

  if(mode === 'resetPassword'){
    try{
      await verifyPasswordResetCode(auth, code);
      show('resetForm');
    }catch(err){
      $('#errorMsg').textContent='Ссылка устарела или уже была использована.';
      show('errorBox');
    }

    $('#form').addEventListener('submit', async e=>{
      e.preventDefault();
      const p1 = $('#p1').value, p2 = $('#p2').value;
      $('#h1').textContent = ''; $('#h2').textContent = '';
      if(p1.length<8){ $('#h1').textContent='Минимум 8 символов'; return; }
      if(p1!==p2){ $('#h2').textContent='Пароли не совпадают'; return; }
      const btn = $('#save'); btn.disabled=true; const html=btn.innerHTML; btn.innerHTML='<span class="spinner"></span>';
      try{
        await confirmPasswordReset(auth, code, p1);
        location.href = '/auth.html?state=reset-done';
      }catch(err){
        btn.disabled=false; btn.innerHTML=html;
        $('#h2').textContent = 'Не удалось сохранить пароль. Попробуйте ещё раз.';
      }
    });
    return;
  }

  if(mode === 'verifyEmail'){
    show('verifying');
    try{
      await applyActionCode(auth, code);
      show('verifyOk');
      setTimeout(()=>location.href='/auth.html?state=verified', 1500);
    }catch(err){
      $('#errorMsg').textContent='Ссылка подтверждения устарела. Запросите новую в кабинете.';
      show('errorBox');
    }
    return;
  }

  $('#errorMsg').textContent='Неизвестное действие.';
  show('errorBox');
}
run();
</script>
</body>
</html>
