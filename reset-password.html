<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Восстановление пароля — SMM-Boost</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 18px; background: radial-gradient(circle at 50% 0%, #273469 0, #0d1020 42%, #070812 100%); color: #f8fafc; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { width: min(100%, 430px); border-radius: 22px; padding: 24px; background: rgba(15,23,42,.74); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 28px 80px rgba(0,0,0,.42); backdrop-filter: blur(22px); }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 18px; color: #cbd5e1; font-size: 14px; line-height: 1.55; }
    label { display: block; margin: 0 0 7px; color: #dbeafe; font-size: 12px; font-weight: 800; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 12px; padding: 13px 14px; border-radius: 13px; border: 1px solid rgba(255,255,255,.13); background: rgba(2,6,23,.56); color: #fff; font: 500 15px/1.2 inherit; outline: 0; }
    input:focus { border-color: rgba(103,232,249,.72); box-shadow: 0 0 0 4px rgba(103,232,249,.13); }
    button { width: 100%; min-height: 46px; border: 0; border-radius: 13px; background: linear-gradient(135deg, #7c3aed, #0891b2); color: #fff; font: 800 15px/1 inherit; cursor: pointer; }
    button:disabled { opacity: .62; cursor: not-allowed; }
    .msg { padding: 11px 12px; border-radius: 12px; font-size: 13px; line-height: 1.4; margin-bottom: 12px; }
    .err { color: #fecaca; background: rgba(127,29,29,.34); border: 1px solid rgba(248,113,113,.35); }
    .ok { color: #bbf7d0; background: rgba(20,83,45,.34); border: 1px solid rgba(74,222,128,.3); }
    [hidden] { display: none !important; }
    a { color: #67e8f9; text-decoration: none; font-weight: 800; }
    .back { margin: 16px 0 0; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Новый пароль</h1>
    <p id="hint">Проверяем ссылку восстановления...</p>
    <div id="error" class="msg err" hidden></div>
    <div id="success" class="msg ok" hidden></div>
    <form id="form" hidden>
      <label for="password">Новый пароль</label>
      <input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="Минимум 6 символов" />
      <button id="submit" type="submit">Сохранить пароль</button>
    </form>
    <p class="back"><a href="/auth.html">Вернуться ко входу</a></p>
  </main>

  <script type="module">
    import { verifyResetCode, confirmPasswordResetCode, humanAuthError } from "/firebase.js?v=20260716-auth-v6";

    const params = new URLSearchParams(location.search);
    const oobCode = params.get("oobCode");
    const mode = params.get("mode") || "resetPassword";
    const hint = document.getElementById("hint");
    const error = document.getElementById("error");
    const success = document.getElementById("success");
    const form = document.getElementById("form");
    const password = document.getElementById("password");
    const submit = document.getElementById("submit");

    function fail(message) { error.textContent = message; error.hidden = false; success.hidden = true; form.hidden = true; }
    function done(message) { success.textContent = message; success.hidden = false; error.hidden = true; form.hidden = true; }

    async function init() {
      if (mode !== "resetPassword" || !oobCode) {
        fail("Ссылка недействительна или устарела. Запросите новое письмо.");
        return;
      }
      try {
        const email = await verifyResetCode(oobCode);
        hint.textContent = `Задайте новый пароль для ${email}.`;
        form.hidden = false;
      } catch (err) {
        fail(humanAuthError(err));
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.hidden = true;
      if (password.value.length < 6) { fail("Пароль должен быть минимум 6 символов."); form.hidden = false; return; }
      submit.disabled = true;
      submit.textContent = "Сохраняем...";
      try {
        await confirmPasswordResetCode(oobCode, password.value);
        done("Пароль обновлён. Сейчас откроется страница входа.");
        setTimeout(() => location.replace("/auth.html"), 1400);
      } catch (err) {
        error.textContent = humanAuthError(err);
        error.hidden = false;
        submit.disabled = false;
        submit.textContent = "Сохранить пароль";
      }
    });

    init().catch((err) => fail(humanAuthError(err)));
  </script>
</body>
</html>
