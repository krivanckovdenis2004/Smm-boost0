<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новый пароль | SMM-BOOST</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="style.css?v=20260711-premium">
<style>
.auth-card{max-width:460px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg-animation"><span></span><span></span><span></span><span></span></div>

<main class="auth-page">
  <section class="auth-card">
    <h1>Новый пароль</h1>
    <p id="resetInfo">Проверяем ссылку…</p>
    <form id="resetForm" class="auth-form hidden" autocomplete="on">
      <input type="hidden" name="email" id="resetEmail" autocomplete="username">
      <label for="newPassword">Новый пароль</label>
      <input id="newPassword" name="new-password" type="password" autocomplete="new-password" minlength="6" required placeholder="Минимум 6 символов">
      <label for="newPasswordConfirm">Повторите пароль</label>
      <input id="newPasswordConfirm" name="new-password-confirm" type="password" autocomplete="new-password" minlength="6" required>
      <button class="primary-wide-btn" type="submit">Сохранить пароль</button>
    </form>
    <div id="resetError" class="auth-message"></div>
    <div style="text-align:center;margin-top:12px">
      <a href="auth.html" style="color:#7cc4ff">← На страницу входа</a>
    </div>
  </section>
</main>

<script type="module">
import { verifyResetCode, confirmReset, humanError } from './firebase-auth.js';

const info = document.getElementById('resetInfo');
const form = document.getElementById('resetForm');
const err = document.getElementById('resetError');
const emailField = document.getElementById('resetEmail');
const btn = form.querySelector('button[type="submit"]');

const params = new URLSearchParams(location.search);
const oobCode = params.get('oobCode');
const mode = params.get('mode');

async function init(){
  if(mode !== 'resetPassword' || !oobCode){
    info.textContent = 'Ссылка некорректна. Запросите новую через «Забыли пароль?».';
    return;
  }
  try{
    const email = await verifyResetCode(oobCode);
    emailField.value = email || '';
    info.innerHTML = 'Установите новый пароль для <b>' + (email||'') + '</b>.';
    form.classList.remove('hidden');
  }catch(e){
    info.textContent = humanError(e);
  }
}

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  err.textContent = '';
  const p1 = document.getElementById('newPassword').value;
  const p2 = document.getElementById('newPasswordConfirm').value;
  if(p1.length < 6){ err.textContent = 'Пароль минимум 6 символов.'; err.className='auth-message err'; return; }
  if(p1 !== p2){ err.textContent = 'Пароли не совпадают.'; err.className='auth-message err'; return; }
  btn.disabled = true;
  const orig = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span>Сохраняем…';
  try{
    await confirmReset(oobCode, p1);
    info.textContent = 'Пароль обновлён. Перенаправляем на вход…';
    form.classList.add('hidden');
    setTimeout(()=>location.replace('auth.html?reset=1'), 900);
  }catch(e){
    err.textContent = humanError(e);
    err.className = 'auth-message err';
    btn.disabled = false;
    btn.innerHTML = orig;
  }
});

init();
</script>
</body>
</html>
