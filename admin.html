<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SMM-Boost Admin</title>

<link rel="stylesheet" href="style.css?v=20260603-final-working">

<script src="metrika-goals.js"></script>
</head>

<body>

<div id="adminLogin" class="services">
  <div class="card">
    <h2>Вход в админ-панель</h2>
    <p>Авторизуйтесь как администратор</p>
    <div id="adminLoginMsg" class="auth-message" style="display:none;"></div>
  </div>
</div>

<div id="adminPanel" style="display:none;">

<header>

<h1>SMM-Boost Admin</h1>

<p>Управление заказами</p>

</header>

<div class="adminFilters">

  <button
  class="filterBtn activeFilter"
  data-filter="all">

    Все

  </button>

  <button
  class="filterBtn"
  data-filter="process">

    🟡 В обработке

  </button>

  <button
  class="filterBtn"
  data-filter="done">

    🟢 Выполнено

  </button>

  <button
  class="filterBtn"
  data-filter="cancel">

    🔴 Отменено

  </button>

</div>

<div id="ordersContainer"
class="services">

</div>

</div>

<script type="module" src="admin.js"></script>

<script src="user-state.js?v=20260603-final-working"></script>
</body>

</html>
