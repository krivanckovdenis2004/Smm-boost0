<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SMM-Boost Admin</title>

<link rel="stylesheet" href="style.css?v=20260711-premium">

<script src="metrika-goals.js"></script>
</head>

<body>

<script>
(async function adminGate() {
  try {
    const existing = sessionStorage.getItem('sb_admin_token');
    if (existing) return;

    const password = prompt('Введите пароль администратора');
    if (!password) {
      document.body.innerHTML = '';
      alert('Доступ запрещен');
      return;
    }

    const res = await fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok || !data.ok) {
      document.body.innerHTML = '';
      alert(data.error || 'Доступ запрещен');
      return;
    }

    sessionStorage.setItem('sb_admin_token', data.token);
  } catch (e) {
    document.body.innerHTML = '';
    alert('Ошибка авторизации: ' + (e?.message || 'неизвестно'));
  }
})();
</script>

<header>

<h1>SMM-Boost Admin</h1>

<p>Управление заказами</p>

</header>

<div class="adminFilters">

  <button
  class="filterBtn activeFilter"
  data-filter="all">

    Все

  </button>

  <button
  class="filterBtn"
  data-filter="process">

    🟡 В обработке

  </button>

  <button
  class="filterBtn"
  data-filter="done">

    🟢 Выполнено

  </button>

  <button
  class="filterBtn"
  data-filter="cancel">

    🔴 Отменено

  </button>

</div>

<div id="ordersContainer"
class="services">

</div>

<script type="module" src="admin.js"></script>

<script src="user-state.js?v=20260603-final-working"></script>
</body>

</html>
