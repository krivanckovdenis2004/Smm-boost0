<!DOCTYPE html>

<html lang="ru">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0"/>

  <title>Мои заказы</title>

  <link rel="stylesheet"
  href="style.css">

</head>

<body>

<h1 class="orders-title">Мои заказы</h1>

<div id="orders-list"></div>

<script>
const orders =
JSON.parse(localStorage.getItem("orders")) || [];

const container =
document.getElementById("orders-list");

if (orders.length === 0) {

  container.innerHTML = `
    <div class="empty-orders">
      Заказов пока нет
    </div>
  `;

} else {

  orders.forEach(order => {

    container.innerHTML += `
      <div class="order-card">

        <h3>${order.service}</h3>

        <p>
          Количество:
          ${order.quantity}
        </p>

        <p>
          Статус:
          ${order.status}
        </p>

        <p>
          ${order.created}
        </p>

      </div>
    `;

  });

}
</script>

<div class="bg-animation">

  <span></span>
  <span></span>
  <span></span>
  <span></span>

</div>

<nav class="navbar">

  <div class="nav-logo">
    SMM-Boost
  </div>

  <div class="nav-links">

    <a href="index.html">
      Главная
    </a>

  </div>

</nav>

<section class="my-orders-page">

  <h1>Мои заказы</h1>

  <div id="ordersList">

    <p class="emptyOrders">

      У вас пока нет заказов

    </p>

  </div>

</section>
<div id="toastContainer"></div>
<script type="module"
src="orders.js"></script>

</body>

</html>
