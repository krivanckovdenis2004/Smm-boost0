<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Взаимные подписки | SMM-BOOST</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="mutuals-page">

<h1>🔥 Взаимные подписки</h1>

<p class="mutuals-sub">
Временная система продвижения сообщества SMM-BOOST
</p>

<div class="mutuals-warning">
⚠️ Чтобы добавить свою ссылку — подпишитесь минимум на 10 профилей ниже
</div>

<div class="mutuals-list" id="mutualsList"></div>

<div class="mutuals-form">

<select id="social">
<option>TikTok</option>
<option>Telegram</option>
<option>VK</option>
<option>YouTube</option>
<option>Instagram</option>
</select>

<input type="url" id="profileLink" placeholder="Ссылка на профиль">

<button onclick="addProfile()">
🚀 Добавить профиль
</button>

</div>

<div class="boost-box">

<h2>🚀 Устали от взаимок?</h2>

<p>
Запустите автоматическое продвижение и получайте подписчиков без поиска взаимок.
</p>

<a href="index.html#services">
Получить продвижение
</a>

</div>

</div>

<script src="mutuals.js"></script>

</body>
</html>
